name: RaceDay CI

# Builds the API and the MVC app, runs every unit test and builds both Docker images
# on every push (and on pull requests).
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Part 1 documents are in /docs
        run: |
          test -f docs/raceday_erd.png
          test -f docs/raceday_api_endpoint_plan.pdf
          test -f docs/raceday_schema.sql

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore (API + tests)
        run: dotnet restore Part2_RaceDayApi/RaceDay.sln

      - name: Build API (Part 2)
        run: dotnet build Part2_RaceDayApi/RaceDay.sln --configuration Release --no-restore

      - name: Run unit tests
        run: dotnet test Part2_RaceDayApi/RaceDay.sln --configuration Release --no-build --verbosity normal

      - name: Restore MVC project (Part 3)
        run: dotnet restore Part3_RaceDayMvc/RaceDay.Web/RaceDay.Web.csproj

      - name: Build MVC project (Part 3)
        run: dotnet build Part3_RaceDayMvc/RaceDay.Web/RaceDay.Web.csproj --configuration Release --no-restore

  docker:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build MVC Docker image
        run: docker build -t raceday-web ./Part3_RaceDayMvc

      - name: Build API Docker image
        run: docker build -t raceday-api ./Part2_RaceDayApi
